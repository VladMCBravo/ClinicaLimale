<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Documento Médico{% endblock %}</title>
    <style>
        /* Estilos do seu evolucao_template.html, agora centralizados */
        @page { 
            size: a4; 
            margin: 2.5cm 1.5cm 2cm 1.5cm; /* Aumentei a margem inferior para o rodapé */
        }
        
        body { font-family: "Helvetica", sans-serif; font-size: 11pt; color: #333; }
        
        /* --- CABEÇALHO PADRÃO --- */
        .header { 
            position: fixed; 
            top: -2cm; /* Puxa para a margem superior */
            left: 0; 
            right: 0; 
            width: 100%;
            display: -pdf-flex; /* Flexbox para xhtml2pdf */
            -pdf-flex-direction: row;
            -pdf-justify-content: space-between;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .header .logo { max-height: 70px; max-width: 180px; }
        .header .info { 
            text-align: right; 
            font-size: 9pt; 
            color: #555;
            line-height: 1.4;
        }
        .header .info strong { font-size: 10pt; color: #000; }
        
        /* --- RODAPÉ PADRÃO --- */
        .footer { 
            position: fixed; 
            bottom: -1.5cm; /* Puxa para a margem inferior */
            left: 0; 
            right: 0; 
            width: 100%; 
            text-align: center; 
            font-size: 9pt; 
            color: #777; 
            border-top: 1px solid #eee;
            padding-top: 5px;
        }
        
        /* --- CONTEÚDO --- */
        h1 { 
            text-align: center; 
            font-size: 16pt; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #333; 
            padding-bottom: 10px; 
        }
        .section { margin-bottom: 15px; }
        .section-title { font-weight: bold; font-size: 12pt; color: #333; border-bottom: 1px solid #eee; padding-bottom: 3px; margin-bottom: 5px; }
        .content { white-space: pre-wrap; line-height: 1.4; }
        .info-grid { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .info-grid td { padding: 5px; vertical-align: top; }
        .label { font-weight: bold; width: 120px; }

    </style>
</head>
<body>
    <div class="header">
        <div>
            {% if logo_path %}
                <img src="{{ logo_path }}" alt="Logo da Clínica" class="logo">
            {% endif %}
        </div>
        <div class="info">
            <strong>{{ clinica.NOME }}</strong><br>
            {{ clinica.ENDERECO }}<br>
            Telefone/WhatsApp: {{ clinica.TELEFONE }}<br>
            E-mail: {{ clinica.EMAIL }}
        </div>
    </div>

    <div class="footer">
        {{ clinica.NOME }} | {{ clinica.TELEFONE }} | {{ clinica.ENDERECO }}
    </div>

    <main>
        {% block content %}
            {% endblock %}
    </main>
</body>
</html>
