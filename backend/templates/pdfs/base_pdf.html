<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Documento Médico{% endblock %}</title>
    <style>
        @page {
            size: a4;
            margin-top: 6.0cm; 
            margin-bottom: 5.5cm; 
            margin-left: 1.5cm;
            margin-right: 1.5cm;
            
            /* CAIXA DO CABEÇALHO (Informações do Paciente) */
            @frame header_info {
                -pdf-frame-content: header_content;
                left: 10cm; 
                right: 1.5cm;
                top: 2.0cm;  
                height: 3.0cm;
            }

            /* CAIXA DA ASSINATURA (Rodapé) */
            @frame assinatura_footer {
                -pdf-frame-content: assinatura_digital;
                left: 2.0cm; 
                right: 2.0cm;
                bottom: 2.0cm; 
                height: 3.2cm; 
            }
        }
        
        body { font-family: "Helvetica", sans-serif; font-size: 12pt; color: #333; line-height: 1.15; }
        
        /* CSS Universal Compartilhado */
        .header-text { font-family: Helvetica, sans-serif; font-size: 11pt; color: #1C2E4A; line-height: 1.4; }
        .header-linha { border-bottom: 1px solid #E67E22; margin-top: 6px; }
        .titulo-exame { text-align: center; color: #1C2E4A; font-size: 14pt; font-weight: bold; margin-top: 5px; margin-bottom: 10px; text-transform: uppercase; }
        .section-title { font-weight: bold; font-size: 14pt; color: #2E7D32; border-bottom: 1px solid #eee; padding-bottom: 3px; margin-top: 15px; margin-bottom: 5px; }
        .content-text { font-size: 12pt; text-align: justify; line-height: 1.15; }
        .obs-text { font-size: 10pt; color: #666; text-align: justify; line-height: 1.1; margin-top: 10px; }
        .info-grid { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12pt; }
        .info-grid td { padding: 5px 0; vertical-align: top; border-bottom: 1px solid #f9f9f9;}

        /* --- RESET PARA O REACT QUILL (Evita quebra de página excessiva) --- */
        .content-text p {
            margin: 0 0 4px 0; /* Define uma margem inferior bem pequena, como no Word */
            padding: 0;
            line-height: 1.15;
        }

        .content-text ul, .content-text ol {
            margin: 4px 0 4px 0;
            padding-left: 20px;
        }

        .content-text li {
            margin: 0 0 2px 0;
            padding: 0;
        }

        .content-text h1, .content-text h2, .content-text h3 {
            margin: 10px 0 5px 0;
            padding: 0;
            font-size: 13pt;
            page-break-after: avoid; /* Evita que o título fique isolado no fim da página */
        }
    </style>
</head>
<body>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
